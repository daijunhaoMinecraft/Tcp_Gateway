name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v1.0.0)'
        required: true
        type: string
      release_notes:
        description: '版本更新内容'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target: windows-x64
          - os: windows-latest
            arch: x86
            target: windows-x86
          - os: ubuntu-22.04
            arch: x64
            target: linux-x64
          - os: ubuntu-22.04-arm
            arch: arm64
            target: linux-arm64
          - os: macos-13
            arch: x64
            target: macos-x64
          - os: macos-14
            arch: arm64
            target: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set version string
        id: version
        run: |
          $version = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $version -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> $env:GITHUB_OUTPUT
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Set version string
        id: version_unix
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT
        if: runner.os != 'Windows'

      - name: Build with Nuitka (Windows)
        if: runner.os == 'Windows'
        run: |
          nuitka `
            --standalone `
            --onefile `
            --windows-console-mode=disable `
            --product-name="TCP安全转发服务" `
            --file-version=${{ steps.version.outputs.version }}.0 `
            --product-version=${{ steps.version.outputs.version }} `
            --company-name="TCP Gateway" `
            --file-description="TCP Security Forwarding Service" `
            --output-dir=dist `
            main.py
        shell: pwsh

      - name: Build with Nuitka (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          nuitka \
            --standalone \
            --onefile \
            --output-dir=dist \
            main.py

      - name: Rename output (Windows)
        if: runner.os == 'Windows'
        run: |
          $arch = "${{ matrix.arch }}"
          if ($arch -eq "x86") {
            $suffix = "windows-x86.exe"
          } else {
            $suffix = "windows-x64.exe"
          }
          Get-ChildItem -Path dist -Filter "*.exe" | ForEach-Object {
            Rename-Item $_.FullName -NewName "tcp-gateway-$suffix"
          }
        shell: pwsh

      - name: Rename output (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          for file in *.bin; do
            mv "$file" "tcp-gateway-${{ matrix.target }}"
          done

      - name: Rename output (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          for file in *.bin; do
            mv "$file" "tcp-gateway-${{ matrix.target }}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcp-gateway-${{ matrix.target }}
          path: dist/tcp-gateway-*
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Generate release notes
        id: release_notes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "## 自动发布的版本 ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "### 变更内容" >> $GITHUB_OUTPUT
            git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_unix.outputs.tag || github.ref_name }}
          name: Release ${{ steps.version_unix.outputs.tag || github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
